[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixlang"
version = "0.5.0"
description = "A minimal, human-readable DSL for computer vision pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "PixLang Contributors" }
]
keywords = ["computer-vision", "dsl", "image-processing", "pipeline", "opencv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Tested on OpenCV 4.8+ and 5.x; any of opencv-python(-headless) works.
    "opencv-python>=4.8,<6",
    "numpy>=1.24",
    "tomli>=1.1; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff==0.16.8",
]
editor = [
    "flask>=3.0",
]

[project.scripts]
pixlang = "pixlang.cli:main"

[project.urls]
Homepage = "https://github.com/hackbert301009/pixlang"
Repository = "https://github.com/hackbert301009/pixlang"
Issues = "https://github.com/hackbert301009/pixlang/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pixlang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["pixlang"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["pixlang/editor/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",    # long lines: docstrings/tables are wrapped by hand
    "E701",    # several statements on one line (compact helpers)
    "E702",
    "E731",    # lambda assignment (dispatch tables)
    "E741",    # ambiguous names like l1/l2 in IN_RANGE
    "UP006",   # typing.List etc. kept for consistency across modules
    "UP007",
    "UP035",
    "UP045",
    "B008",    # function calls in defaults
    "B905",    # zip(strict=) needs Python 3.10
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E712", "F401", "F811", "F841"]
# The executor deliberately re-wraps errors as PixRuntimeError carrying line/col.
"pixlang/executor/engine.py" = ["B904"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["pixlang"]
